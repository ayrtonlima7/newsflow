<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Standard logo icon definition -->
  <g id="logo-icon">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#brand)"/>
    <!-- N perfectly centered in 64x64 box:
         left=18 right=46 (center=32), top=15 bottom=49 (center=32), stem_width=10 -->
    <path d="M 18 49 L 18 15 L 36 34 L 36 15 L 46 15 L 46 49 L 28 34 L 28 49 Z" fill="white"/>
  </g>

  <!-- Render at 180x180 (centered in 200x200) -->
  <use href="#logo-icon" transform="translate(10, 10) scale(2.8125)"/>
</svg>
