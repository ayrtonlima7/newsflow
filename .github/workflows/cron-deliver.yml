name: NewsFlow cron — deliver emails

# DESATIVADO como cron automático. O agendamento agora roda via cron-job.org
# (GitHub Actions descartava execuções silenciosamente — não confiável).
# Mantido só pra trigger MANUAL (workflow_dispatch) como backup de emergência.
#
# Pra reativar o schedule (não recomendado): descomente o bloco `schedule` abaixo.

on:
  # schedule:
  #   - cron: '45 * * * *'
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger NewsFlow delivery endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Faltam secrets APP_URL e/ou CRON_SECRET no repositório"
            exit 1
          fi

          echo "📬 Disparando cron em $APP_URL/api/cron/deliver"
          response=$(curl -sS -w "\n%{http_code}" \
            -X GET "$APP_URL/api/cron/deliver" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 120)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP $http_code"
          echo "$body" | head -100

          if [ "$http_code" -ne 200 ]; then
            echo "::error::Endpoint retornou HTTP $http_code"
            exit 1
          fi
